aid: rain
name: Rain
description: Rain is an enterprise stablecoin payments platform that lets companies embed digital-dollar
  money movement into their products through a single API. Its infrastructure spans stablecoin wallets
  and virtual accounts, card issuing (Rain is a Visa and Mastercard Principal Member, settling Visa card
  transactions daily in stablecoins across multiple blockchains), and money movement via fiat on-ramps,
  off-ramps, and cross-border payment orchestration. Rain abstracts the back-end complexity of making
  on-chain stablecoins interoperable with traditional card networks, and maintains PCI DSS and SOC 2
  compliance. Customers include Western Union, Nuvei, and ether.fi. Rain has raised over $338M, including
  a $250M Series C led by ICONIQ and a Series B led by Sapphire Ventures.
